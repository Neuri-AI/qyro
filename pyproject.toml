[project]
name = "qyro-engine"
version = "0.1.0"
description = "Qyro Engine is the runtime engine for the Velto ecosystem, providing the foundation for building and running Python applications across desktop and mobile platforms."
authors = [
    { name = "runesc", email = "luisalfredoreyes98@gmail.com" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<3.14.20"
dependencies = [
    "cryptography>=50.0.2,<=51.0.0"
]

[project.optional-dependencies]
pyside6 = ["PySide6>=6.8; python_version < '3.14'"]
pyqt6 = ["PyQt6>=6.8; python_version < '3.14'"]
pyside2 = ["PySide2>=5.15,<6; python_version < '3.11'"]
pyqt5 = ["PyQt5>=5.15; python_version < '3.14'"]
kivy = ["kivy>=2.3"]
sentry = ["sentry-sdk>=1.30.0"]
all = [
    "PySide6>=6.8; python_version < '3.14'",
    "PyQt6>=6.8; python_version < '3.14'",
    "PySide2>=5.15,<6; python_version < '3.11'",
    "PyQt5>=5.15; python_version < '3.14'",
    "kivy>=2.3",
    "sentry-sdk>=1.30.0"
]

[tool.poetry]
packages = [{ include = "qyro" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-cov = ">=4.1.0"
cython = ">=3.0.12,<4.0.0"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"