[tool.poetry]
name = "qyro-engine"
version = "1.0.0a2"
description = "Qyro Engine is the runtime engine for the Qyro ecosystem, providing the foundation for building and running Python applications across desktop and mobile platforms."
authors = ["Qyro Team"]
license = "MIT"
readme = "README.md"
packages = [{include = "qyro"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.16"
cryptography = ">=45.0.0,<47.0.0"

PySide6 = {version = ">=6.5.0", optional = true, python = ">=3.11,<3.15"}
PyQt6 = {version = ">=6.5.0", optional = true, python = ">=3.11,<3.15"}
PySide2 = {version = ">=5.15.0", optional = true, python = "<3.11"}
PyQt5 = {version = ">=5.15.0", optional = true, python = ">=3.11,<3.14"}
kivy = {version = ">=2.2.0", optional = true}
sentry-sdk = {version = ">=1.30.0", optional = true}

[tool.poetry.extras]
pyside6 = ["PySide6"]
pyqt6 = ["PyQt6"]
pyside2 = ["PySide2"]
pyqt5 = ["PyQt5"]
kivy = ["kivy"]
sentry = ["sentry-sdk"]
all = ["PySide6", "PyQt6", "PySide2", "PyQt5", "kivy", "sentry-sdk"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-cov = ">=4.1.0"
cython = ">=3.0.12,<4.0.0"

[tool.pytest.ini_options]
# Example projects deliberately use the same test module names.  Import tests
# by path so pytest does not treat them as one top-level ``test_project`` module.
addopts = "--import-mode=importlib"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
