name: Velto CSS resource integration
on:
  push:
    branches: [feature/release-css-resource-integration]
  pull_request:
    paths:
      - "qyro/client/velto_context.py"
      - "tests/test_velto_css_resources.py"
      - ".github/workflows/velto-css-resource-integration.yml"
jobs:
  css-resource-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest cryptography
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest -q tests/test_velto_css_resources.py
