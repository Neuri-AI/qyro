name: CSS resource scope behavior
on:
  pull_request:
    paths:
      - "qyro/client/context.py"
      - "tests/test_css_stylesheet_scope.py"
      - ".github/workflows/css-resource-scope.yml"
  push:
    branches:
      - feature/velto-css-resource-scope
jobs:
  app-stylesheet-scope:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_css_stylesheet_scope.py
