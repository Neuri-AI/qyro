name: Development settings validation
on:
  push:
    branches: [feature/coordinated-hot-reload]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest cryptography
      - run: python -m pip install -e . --no-deps
      - uses: actions/checkout@v4
        with:
          repository: Neuri-AI/PSX
          ref: 69430915ca87681d85f5b9c3fbc2b1f26caf93fe
          path: partner-psx
      - run: python -m pip install -e partner-psx --no-deps
      - uses: actions/checkout@v4
        with:
          repository: Neuri-AI/Pydux
          ref: d4495be4914ab38255d5871d3ade45422003015c
          path: partner-pydux
      - run: python -m pip install -e partner-pydux --no-deps
      - run: python -m pytest -q tests/test_development_settings.py tests/test_development_changes.py tests/test_development_refresh_dispatch.py tests/test_development_state_recovery.py tests/test_coordinated_context_refresh.py tests/test_velto_context.py
