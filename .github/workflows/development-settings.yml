name: Development settings validation
on:
  push:
    branches: [feature/coordinated-hot-reload]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest cryptography
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest -q tests/test_development_settings.py
