name: Development settings validation
on:
  push:
    branches: [feature/coordinated-hot-reload]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest cryptography
      - run: python -m pip install -e . --no-deps
      - uses: actions/checkout@v4
        with:
          repository: Neuri-AI/PSX
          ref: 207b3dc28fa2c8af3b4b70293a198cdb651a03f5
          path: partner-psx
      - run: python -m pip install -e partner-psx --no-deps
      - run: python -m pytest -q tests/test_development_settings.py tests/test_development_changes.py tests/test_development_refresh_dispatch.py tests/test_coordinated_context_refresh.py tests/test_velto_context.py
