name: Coordinated Pydux hot reload
on:
  push:
    branches: [feature/coordinated-hot-reload]
  pull_request:
jobs:
  pydux-coordination:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_development_pydux.py
