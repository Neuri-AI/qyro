name: Kivy window startup geometry

on:
  push:
    branches: ['fix/kivy-retina-window-geometry']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-startup:
    name: Kivy startup geometry / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install context test dependencies
        run: |
          python -m pip install pytest cryptography
          python -m pip install -e . --no-deps
      - name: Test window bounds and lifecycle without a native UI loop
        run: python -m pytest -q tests/test_kivy_window_geometry.py tests/test_velto_context.py -k "kivy or window_geometry"
