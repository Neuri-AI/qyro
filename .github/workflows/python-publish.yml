
name: Upload Python Package

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (e.g. v0.1.2)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-24.04

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | POETRY_VERSION=2.4.1 python3 -
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate release tag matches project version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

          expected="${RELEASE_TAG#v}"
          actual="$(poetry version --short)"

          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Version mismatch!"
            echo "::error::Tag: $RELEASE_TAG"
            echo "::error::Project version: $actual"
            exit 1
          fi

          echo "Verified: $RELEASE_TAG == qyro-engine $actual"

      - name: Check whether version exists on PyPI
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          version = os.environ["RELEASE_TAG"][1:]
          url = f"https://pypi.org/pypi/qyro-engine/{version}/json"

          try:
              with urllib.request.urlopen(url, timeout=20) as response:
                  data = json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  print(f"Version {version} not found on PyPI.")
              else:
                  raise
          else:
              print(
                  f"::error::qyro-engine {version} already exists "
                  "on PyPI."
              )
              raise SystemExit(1)
          PY

      - name: Build release distributions
        run: poetry build --clean

      - name: Validate wheel and sdist metadata
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import email
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          expected = os.environ["RELEASE_TAG"][1:]
          files = sorted(Path("dist").iterdir())

          wheels = [
              p for p in files if p.name.endswith(".whl")
          ]
          sdists = [
              p for p in files if p.name.endswith(".tar.gz")
          ]

          assert len(files) == 2, files
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists

          assert wheels[0].name.startswith(
              f"qyro_engine-{expected}-"
          )
          assert sdists[0].name == (
              f"qyro_engine-{expected}.tar.gz"
          )

          with zipfile.ZipFile(wheels[0]) as archive:
              names = [
                  name for name in archive.namelist()
                  if name.endswith(".dist-info/METADATA")
              ]
              assert len(names) == 1
              wheel_metadata = email.message_from_bytes(
                  archive.read(names[0])
              )

          with tarfile.open(sdists[0]) as archive:
              members = [
                  member for member in archive.getmembers()
                  if member.name.endswith("/PKG-INFO")
              ]
              assert len(members) == 1
              stream = archive.extractfile(members[0])
              assert stream is not None
              sdist_metadata = email.message_from_bytes(
                  stream.read()
              )

          for metadata in (
              wheel_metadata,
              sdist_metadata,
          ):
              package = metadata.get(
                  "Name", ""
              ).lower().replace("_", "-")

              version = metadata.get("Version")

              assert package == "qyro-engine", package
              assert version == expected, version

          print(
              f"Validated wheel and sdist: "
              f"qyro-engine {expected}"
          )
          PY

      - name: Upload release distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error
          retention-days: 7

  pypi-publish:
    runs-on: ubuntu-24.04
    needs: release-build

    environment:
      name: pypi
      url: https://pypi.org/project/qyro-engine/

    permissions:
      id-token: write

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
